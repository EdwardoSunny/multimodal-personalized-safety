[project]
name = "multimodal-personalized-safety"
version = "1.0.0"
description = "MPS-Bench and PRISM: personalized safety benchmark and deferral monitor for vision-language models"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
    "accelerate>=1.10.1",
    "datasets>=4.1.1",
    "google-genai>=1.39.1",
    "httpx>=0.28.1",
    "huggingface-hub>=0.34",
    "kagglehub>=1.0.3",
    "modal>=1.3.0",
    "numpy>=2.0",
    "openai>=1.100.2",
    "opencv-python>=4.11.0.86",
    "pillow>=12.0,<13",  # Pillow 13 changed bilinear resizing; <13 reproduces the paper's PRISM embeddings
    "requests>=2.32.5",
    "safetensors>=0.4",
    "scikit-learn>=1.6",
    "sentencepiece>=0.2.1",
    "torch>=2.9,<2.10",
    "torchvision>=0.24,<0.25",
    "tqdm>=4.67.1",
    "transformers>=4.57.1,<5",
    "wandb>=0.24.0",
]

[tool.uv]
package = false
